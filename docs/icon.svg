<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hostpad">
  <title>Hostpad</title>

  <!-- Rounded plate. Flat colour, because the icon has to survive being drawn
       at 16 pixels where gradients turn to mud. -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#1E62D0"/>

  <!-- An H built from two posts and a bar. The posts are the two machines and
       the bar is the link between them, which is why it runs past both instead
       of stopping at the joins. Three heavy shapes, so the mark still reads
       once it is 16 pixels wide. -->
  <rect x="72" y="64" width="28" height="128" rx="14" ry="14" fill="#FFFFFF"/>
  <rect x="156" y="64" width="28" height="128" rx="14" ry="14" fill="#FFFFFF"/>
  <rect x="56" y="114" width="144" height="28" rx="14" ry="14" fill="#FFC53D"/>
</svg>
