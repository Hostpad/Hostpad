<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Hostpad">
  <title>Hostpad</title>

  <!-- Rounded plate. Flat colour, because the icon has to survive being drawn
       at 16 pixels where gradients turn to mud. -->
  <rect x="0" y="0" width="256" height="256" rx="56" ry="56" fill="#1E62D0"/>

  <!-- Command prompt: the chevron and the caret. Stroke widths are heavy on
       purpose so the shape still reads at the smallest size. -->
  <polyline points="84,88 128,128 84,168"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="24"
            stroke-linecap="round"
            stroke-linejoin="round"/>

  <rect x="140" y="152" width="52" height="18" rx="9" ry="9" fill="#FFC53D"/>
</svg>
