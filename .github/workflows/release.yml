name: release

on:
  push:
    tags: ['v*']

  # Two uses: rehearse a release without tagging, or attach rebuilt assets to
  # a release that already exists, which is what the tag input is for.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to attach the builds to, e.g. v1.0.0. Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version
        id: version
        shell: pwsh
        run: |
          # A tag push names the version; a manual run can name it through the
          # tag input; otherwise there is nothing to go on, so it builds as dev.
          $ref = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ inputs.tag }}' }
          $version = if ($ref -match '^v(\d+\.\d+\.\d+.*)$') { $Matches[1] } else { '0.0.0-dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building $version"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Hostpad.App/Hostpad.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish/Hostpad `
            -p:Version=${{ steps.version.outputs.version }}

      # The MIT licences of the bundled libraries ask for their notices to
      # travel with the software, so the notices ship inside the archive.
      - name: Add the licence, notices and readme
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/Hostpad/
          Copy-Item THIRD-PARTY-NOTICES.md publish/Hostpad/
          Copy-Item README.md publish/Hostpad/

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "Hostpad-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/Hostpad/* -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      # A standalone build: one file that runs on a machine with no .NET
      # installed. Much larger than the others, which is why all three ship.
      - name: Publish a standalone executable
        id: standalone
        shell: pwsh
        run: |
          dotnet publish Hostpad.App/Hostpad.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --output publish/standalone `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true

          $name = "Hostpad-${{ steps.version.outputs.version }}-win-x64.exe"
          Move-Item publish/standalone/Hostpad.exe $name
          "name=$name" >> $env:GITHUB_OUTPUT

      # The same app bundled into one file but still using the installed
      # runtime. No compression here: the SDK only allows it when the build is
      # self-contained (NETSDK1176).
      - name: Publish a single-file executable
        id: singlefile
        shell: pwsh
        run: |
          dotnet publish Hostpad.App/Hostpad.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish/singlefile `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true

          Copy-Item publish/singlefile/Hostpad.exe Hostpad.exe
          "name=Hostpad.exe" >> $env:GITHUB_OUTPUT

      - name: Attach the builds to the run
        uses: actions/upload-artifact@v4
        with:
          name: Hostpad-${{ steps.version.outputs.version }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.standalone.outputs.name }}
            ${{ steps.singlefile.outputs.name }}

      # Written once so a tag push and a re-upload describe the same assets.
      - name: Compose the release notes
        shell: pwsh
        run: |
          @"
          ### Download

          | File | Use it when |
          | --- | --- |
          | ``${{ steps.standalone.outputs.name }}`` | You want a single file that runs on any Windows machine. Nothing to install. |
          | ``${{ steps.singlefile.outputs.name }}`` | You already have the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0) and want a single file. |
          | ``${{ steps.package.outputs.name }}`` | You have the runtime and prefer the smallest download. Unzip anywhere and run ``Hostpad.exe``. |

          Your connections are stored in ``%USERPROFILE%\.hostpad``.

          Windows SmartScreen may warn on first run: the build is not code-signed. Choose **More info → Run anyway**.
          "@ | Out-File notes.md -Encoding utf8

      - name: Publish the release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create '${{ github.ref_name }}' `
            '${{ steps.standalone.outputs.name }}' `
            '${{ steps.singlefile.outputs.name }}' `
            '${{ steps.package.outputs.name }}' `
            --title 'Hostpad ${{ steps.version.outputs.version }}' `
            --notes-file notes.md `
            --generate-notes

      - name: Attach the builds to an existing release
        if: github.ref_type != 'tag' && inputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload '${{ inputs.tag }}' `
            '${{ steps.standalone.outputs.name }}' `
            '${{ steps.singlefile.outputs.name }}' `
            '${{ steps.package.outputs.name }}' `
            --clobber

          # The notes list the assets, so they go stale when the assets change.
          # Rewrite only our table and keep whatever gh generated below it,
          # since --notes-file would otherwise replace the whole body.
          $body = gh release view '${{ inputs.tag }}' --json body --jq .body
          $generated = ''
          $marker = -1

          # gh writes "## What's Changed" only when pull requests were merged in
          # the range. Commits pushed straight to the branch leave nothing but
          # the Full Changelog line, so both openings count; keep from whichever
          # comes first.
          foreach ($needle in "## What's Changed", "**Full Changelog**") {
            $at = $body.IndexOf($needle)

            if ($at -ge 0 -and ($marker -lt 0 -or $at -lt $marker)) {
              $marker = $at
            }
          }

          if ($marker -ge 0) {
            $generated = "`n`n" + $body.Substring($marker)
          }

          (Get-Content notes.md -Raw) + $generated | Out-File merged.md -Encoding utf8
          gh release edit '${{ inputs.tag }}' --notes-file merged.md
