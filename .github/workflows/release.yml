name: release

on:
  push:
    tags: ['v*']

  # Lets a release be rehearsed without tagging: the artifact is built and
  # attached to the run, but no GitHub release is published.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Read the version from the tag
        id: version
        shell: pwsh
        run: |
          $ref = '${{ github.ref_name }}'
          # v0.1.0 becomes 0.1.0; a manual run has no tag, so it builds as 0.0.0-dev.
          $version = if ($ref -match '^v(\d+\.\d+\.\d+.*)$') { $Matches[1] } else { '0.0.0-dev' }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building $version"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish
        shell: pwsh
        run: |
          dotnet publish Hostpad.App/Hostpad.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output publish/Hostpad `
            -p:Version=${{ steps.version.outputs.version }}

      - name: Add the licence and readme
        shell: pwsh
        run: |
          Copy-Item LICENSE publish/Hostpad/
          Copy-Item README.md publish/Hostpad/

      - name: Package
        id: package
        shell: pwsh
        run: |
          $name = "Hostpad-${{ steps.version.outputs.version }}-win-x64.zip"
          Compress-Archive -Path publish/Hostpad/* -DestinationPath $name
          "name=$name" >> $env:GITHUB_OUTPUT

      - name: Attach the build to the run
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $notes = @"
          Requires the [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0).

          Unzip anywhere and run ``Hostpad.exe``. Your connections are stored in ``%USERPROFILE%\.hostpad``.
          "@

          gh release create '${{ github.ref_name }}' `
            '${{ steps.package.outputs.name }}' `
            --title 'Hostpad ${{ steps.version.outputs.version }}' `
            --notes $notes `
            --generate-notes
